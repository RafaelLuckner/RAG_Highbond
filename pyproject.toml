[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-highbond"
version = "0.2.0"
description = "Busca semântica (RAG) sobre a documentação da API HighBond, exposta via REST e MCP (stdio/HTTP/SSE)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
rag-api = "rag_highbond.api:main"
rag-mcp = "rag_highbond.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

